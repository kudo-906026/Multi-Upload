name: CI - Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Build & Verify Production Applet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Build Full-Stack Application
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/client/index.html || (echo "Client build missing index.html" && exit 1)
          test -f dist/server/server/index.js || test -f dist/server/index.js || (echo "Server build missing entry point" && exit 1)
          echo "✅ Full-stack build verified successfully!"
