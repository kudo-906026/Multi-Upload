name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Package Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          # Accept licenses without invoking obsolete 'tools' package
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build:client

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-apk
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" release-apk/omnipost-video-latest.apk
            echo "✅ APK generated successfully: release-apk/omnipost-video-latest.apk"
          else
            echo "❌ APK build output not found at $APK_PATH"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnipost-video-android-apk
          path: release-apk/omnipost-video-latest.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apk/omnipost-video-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
