<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0F172A"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <!-- Central lightning bolt and play badge -->
  <g filter="url(#shadow)">
    <!-- Play Triangle background -->
    <circle cx="256" cy="256" r="140" fill="#090D16" fill-opacity="0.85" />
    <!-- Dynamic Lightning Spark -->
    <path d="M276 140 L180 280 L252 280 L236 372 L332 232 L260 232 Z" fill="#FBBF24" stroke="#FFF" stroke-width="6" stroke-linejoin="round" />
  </g>
</svg>
